android.enableJetifier=true
android.nonTransitiveRClass=true
android.useAndroidX=true
# 2026-09-20: heap capped (was -Xmx8192m). On the laptop WSL2 gets 16 GB but Windows commit charge is the real
# ceiling; an 8 GB Gradle heap + Kotlin daemon grew the VM past what Windows could back and Windows killed WSL2
# mid-build (16:50). 3 GB + 1.5 GB is plenty for this app; CI (7 GB runners) is happier with it too.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
kotlin.daemon.jvmargs=-Xmx1536m

# Versioning
VERSION_NAME=1.13.1-fast4
VERSION_CODE=2804
APP_ID=org.fossify.gallery
